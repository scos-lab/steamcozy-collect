name: collect-achievements
on:
  schedule:
    # 13:37 UTC = 23:37-00:37 in Australia; ~6k games/day at 0.3 s ≈ 35 min per shard.
    - cron: '37 13 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC date to emulate (YYYY-MM-DD), empty = today'
        required: false
        default: ''

permissions:
  contents: write   # publish to the rolling release (see the last step)

concurrency:
  group: collect-achievements
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 1/7 of ~41k games per day, 2 shards.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: |
          D="${{ inputs.date }}"
          python3 collect_achievements.py --shard ${{ matrix.shard }}/2 ${D:+--date $D} --out out
      # always(): a timed-out shard still ships what it wrote (gzip is flushed per line
      # only on close, so a hard kill can lose the tail — the meta file is then missing,
      # which the importer treats as "partial").
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ach-${{ github.run_id }}-s${{ matrix.shard }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
      # Also publish to a rolling public release: anyone can download release assets of a
      # public repo without logging in, so the build machine needs no GitHub token to import.
      # One release per kind; assets are dated (news_<date>_s<shard>.*); older than 30 days are deleted.
      - name: Publish to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/* >/dev/null 2>&1 || exit 0
          gh release view ach-data >/dev/null 2>&1 || gh release create ach-data --title "achievement completion rates (rolling, last 30 days)" \
            --notes "Daily output of the achievement completion rates collector. One .jsonl.gz + .meta.json per shard and day. Older than 30 days are pruned." || true
          for i in 1 2 3; do gh release upload ach-data out/* --clobber && break; sleep 10; done
          if [ "${{ matrix.shard }}" = 0 ]; then
            cut=$(date -u -d '30 days ago' +%F)
            gh api "repos/${{ github.repository }}/releases/tags/ach-data" --jq '.assets[] | "\(.id) \(.name)"' \
              | while read -r id name; do d=$(echo "$name" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}'); \
                  if [ -n "$d" ] && [ "$d" \< "$cut" ]; then gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" && echo "pruned $name"; fi; done
          fi

