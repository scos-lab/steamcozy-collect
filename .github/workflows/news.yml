name: collect-news
on:
  schedule:
    # 18:17 UTC = 04:17-05:17 in Australia, done well before the builder's 09:00 run.
    # :17 avoids the top-of-hour crowd (same as the sister repos).
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC date to emulate (YYYY-MM-DD), empty = today'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # ~13k appids/day on a heavy day (hot + Sunday warm + cold 1/7) at 0.25 s pause
    # ≈ 1.2 h per shard with 2 shards; 330 min is the GH 6 h ceiling minus margin.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: |
          D="${{ inputs.date }}"
          python3 collect_news.py --shard ${{ matrix.shard }}/2 ${D:+--date $D} --out out
      # always(): a timed-out shard still ships what it wrote (gzip is flushed per line
      # only on close, so a hard kill can lose the tail — the meta file is then missing,
      # which the importer treats as "partial").
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.run_id }}-s${{ matrix.shard }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
