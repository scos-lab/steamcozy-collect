name: collect-news
on:
  schedule:
    # 14:17 UTC = 00:17-01:17 in Australia. GitHub delays scheduled runs: the first one (cron 18:17)
    # started 21:23 and ended 22:42 UTC, after the builder's 22:00/23:00 UTC daily run had begun.
    # ~1.3 h of work + up to ~4 h of delay still lands before it. :17 avoids the top-of-hour crowd.
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC date to emulate (YYYY-MM-DD), empty = today'
        required: false
        default: ''

permissions:
  contents: write   # publish to the rolling release (see the last step)

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # ~13k appids/day on a heavy day (hot + Sunday warm + cold 1/7) at 0.25 s pause
    # ≈ 1.2 h per shard with 2 shards; 330 min is the GH 6 h ceiling minus margin.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: |
          D="${{ inputs.date }}"
          python3 collect_news.py --shard ${{ matrix.shard }}/2 ${D:+--date $D} --out out
      # always(): a timed-out shard still ships what it wrote (gzip is flushed per line
      # only on close, so a hard kill can lose the tail — the meta file is then missing,
      # which the importer treats as "partial").
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.run_id }}-s${{ matrix.shard }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
      # Also publish to a rolling public release: anyone can download release assets of a
      # public repo without logging in, so the build machine needs no GitHub token to import.
      # One release per kind; assets are dated (news_<date>_s<shard>.*); older than 30 days are deleted.
      - name: Publish to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/* >/dev/null 2>&1 || exit 0
          gh release view news-data >/dev/null 2>&1 || gh release create news-data --title "news (rolling, last 30 days)" \
            --notes "Daily output of the news collector. One .jsonl.gz + .meta.json per shard and day. Older than 30 days are pruned." || true
          for i in 1 2 3; do gh release upload news-data out/* --clobber && break; sleep 10; done
          if [ "${{ matrix.shard }}" = 0 ]; then
            cut=$(date -u -d '30 days ago' +%F)
            gh api "repos/${{ github.repository }}/releases/tags/news-data" --jq '.assets[] | "\(.id) \(.name)"' \
              | while read -r id name; do d=$(echo "$name" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}'); \
                  if [ -n "$d" ] && [ "$d" \< "$cut" ]; then gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" && echo "pruned $name"; fi; done
          fi

